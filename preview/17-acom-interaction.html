<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ACOM interaction</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: #f6f4ef; }
  body { padding: 18px 24px; font-family: var(--font-mono); color: var(--ink); }
  .stage { display: flex; align-items: center; gap: 14px; justify-content: center; }
  .wrist {
    width: 110px; height: 60px;
    background: var(--chassis);
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    color: var(--paper);
    font-family: var(--font-mono);
    font-size: 14px;
    position: relative;
  }
  .wrist .pad {
    position: absolute;
    width: 8px; height: 26px;
    background: #c4b07a;
    box-shadow: inset 0 0 0 1px #8a7a4f;
  }
  .wrist.l .pad { right: -4px; }
  .wrist.r .pad { left: -4px; }
  .arrow {
    width: 64px; height: 0;
    border-top: 2px dashed var(--ink);
    position: relative;
  }
  .arrow::before, .arrow::after {
    content: ''; position: absolute; left: 50%; top: -10px;
    transform: translateX(-50%);
    font-family: var(--font-mono);
    font-size: 13px;
    background: #f6f4ef;
    padding: 0 6px;
  }
  .arrow::before { content: 'ACOM 9600 baud'; }
  .caption {
    margin-top: 12px;
    font-family: var(--font-mono); font-size: 14px;
    opacity: 0.65; text-align: center; line-height: 1.2;
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="wrist l">PING<div class="pad"></div></div>
    <div class="arrow"></div>
    <div class="wrist r"><div class="pad"></div>PONG</div>
  </div>
  <div class="caption">single-wire half-duplex UART · magnets guide alignment</div>
</body>
</html>
