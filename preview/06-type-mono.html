<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Type — mono / logs</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: #f6f4ef; color: var(--ink); }
  body { padding: 18px 22px; font-family: var(--font-mono); }
  pre {
    margin: 0;
    font-family: var(--font-mono);
    font-size: 18px;
    line-height: 1.2;
    background: #111;
    color: #c4c4c4;
    padding: 12px 14px;
    border: 1px solid var(--ink);
    white-space: pre-wrap;
  }
  .meta {
    margin-top: 10px;
    font-family: var(--font-mono); font-size: 14px;
    opacity: 0.7; line-height: 1.2;
  }
  .meta b { color: var(--ink); opacity: 1; }
</style>
</head>
<body>
<pre>[boot] LittleFS mounted
[ble] advertising as wolfram_test
[acom] PING > sent
[acom] PONG &lt; recv
[ui]  page = HOMEPAGE</pre>

</body>
</html>
