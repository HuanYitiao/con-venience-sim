<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Button — physical input</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: #f6f4ef; }
  body { padding: 18px 24px; font-family: var(--font-mono); color: var(--ink); }
  .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .btn-cell { text-align: center; }
  .btn {
    width: 56px; height: 56px;
    border-radius: 50%;
    background: var(--chassis);
    border: 2px solid var(--chassis-edge);
    box-shadow: 0 3px 0 #000, inset 0 2px 0 rgba(255,255,255,0.05);
    display: inline-block;
    position: relative;
  }
  .btn.pressed {
    transform: translateY(2px);
    box-shadow: 0 1px 0 #000, inset 0 2px 6px rgba(0,0,0,0.6);
  }
  .btn.long {
    box-shadow: 0 3px 0 #000, 0 0 0 5px rgba(241,178,74,0.55);
  }
  .label {
    margin-top: 10px;
    font-size: 14px;
    line-height: 1.1;
  }
  .label b { display: block; font-family: var(--font-mono); font-size: 16px; }
  .label span { opacity: 0.6; font-size: 13px; }
</style>
</head>
<body>
  <div class="row">
    <div class="btn-cell">
      <div class="btn"></div>
      <div class="label"><b>idle</b><span>BTN_NONE</span></div>
    </div>
    <div class="btn-cell">
      <div class="btn pressed"></div>
      <div class="label"><b>click</b><span>&lt; 300ms → BTN_CLICK</span></div>
    </div>
    <div class="btn-cell">
      <div class="btn pressed long"></div>
      <div class="label"><b>long press</b><span>≥ 300ms → BTN_LONG_PRESS</span></div>
    </div>
  </div>
</body>
</html>
