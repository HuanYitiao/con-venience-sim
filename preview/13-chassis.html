<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Device chassis</title>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: #f6f4ef; }
  body { padding: 18px 24px; font-family: var(--font-mono); color: var(--ink); display: flex; gap: 22px; align-items: center; }
  .device {
    background: linear-gradient(180deg, #1f1f1f, #141414);
    border-radius: 22px;
    padding: 16px 14px 22px;
    position: relative;
    box-shadow: 0 3px 0 #000;
  }
  .screen {
    width: 360px;
    height: 156px;
    background: var(--paper);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-display);
    font-size: 32px;
    color: var(--ink);
  }
  .btn {
    position: absolute;
    right: -10px; top: 50%; transform: translateY(-50%);
    width: 14px; height: 36px;
    background: #2a2a2a;
    border-radius: 4px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 1px 0 0 #000;
  }
  .strap {
    width: 32px; height: 220px;
    background:
      repeating-linear-gradient(180deg, #6e5f4d 0 8px, #5a4d3f 8px 10px);
    border-radius: 4px;
    box-shadow: inset 0 0 0 1px #4a3f33;
  }
  .strap.right { order: 2; }
  .notes {
    font-size: 13px; line-height: 1.2; opacity: 0.65;
    align-self: flex-end;
  }
  .notes b { color: var(--ink); opacity: 1; display: block; font-family: var(--font-mono); }
</style>
</head>
<body>
  <div class="strap"></div>
  <div class="device">
    <div class="screen">con-venience</div>
    <div class="btn"></div>
  </div>
  <div class="strap right"></div>
  <div class="notes">
    <b>chassis</b>
    radius 18 · 1 button right<br>
    leather strap top + bottom
  </div>
</body>
</html>
