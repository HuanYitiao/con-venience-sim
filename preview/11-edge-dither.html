<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Edge dither — homepage frame</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: #f6f4ef; }
  body { padding: 18px 24px; font-family: var(--font-mono); color: var(--ink); }
  .screen {
    width: 100%;
    aspect-ratio: 296 / 128;
    background: var(--paper);
    border: 1px solid var(--ink);
    border-radius: 4px;
    position: relative;
    overflow: hidden;
    image-rendering: pixelated;
  }
  /* dither bands */
  .band {
    position: absolute; top: 0; bottom: 0;
    width: 22%;
    background-image:
      linear-gradient(to right,
        rgba(17,17,17,1) 0%,
        rgba(17,17,17,0) 100%),
      radial-gradient(#111 0.7px, transparent 1px);
    background-size: 100% 100%, 4px 4px;
    background-blend-mode: multiply;
    image-rendering: pixelated;
  }
  .band.right {
    right: 0;
    transform: scaleX(-1);
  }
  .center {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .cat { width: 22%; image-rendering: pixelated; }
  .caption { margin-top: 10px; font-family: var(--font-mono); font-size: 14px; opacity: 0.65; }
</style>
</head>
<body>
  <div class="screen">
    <div class="band" style="left:0;"></div>
    <div class="band right"></div>
    <div class="center">
      <img class="cat" src="../assets/avatar-bob.png" alt="">
    </div>
  </div>
  <div class="caption">edge-dither pattern — homepage idle screen · decoration only, not a border</div>
</body>
</html>
