<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wordmark</title>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: #f6f4ef; }
  body { padding: 24px; font-family: var(--font-mono); color: var(--ink); }
  .wordmark {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 40px;
    line-height: 1;
    color: var(--ink);
    border-bottom: 3px solid var(--ink);
    display: inline-block;
    padding-bottom: 6px;
    letter-spacing: -1px;
  }
  .tag {
    margin-top: 14px;
    font-family: var(--font-mono);
    font-size: 16px;
    line-height: 1.2;
    opacity: 0.7;
    font-style: italic;
  }
</style>
</head>
<body>
  <div class="wordmark">con-venience</div>
  <div class="tag">— for paws that can't type.</div>
</body>
</html>
