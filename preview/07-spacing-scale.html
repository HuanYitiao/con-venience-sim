<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spacing scale</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: #f6f4ef; color: var(--ink); font-family: var(--font-mono); }
  body { padding: 20px 24px; }
  .row { display: flex; align-items: center; gap: 14px; padding: 6px 0; }
  .bar { background: var(--ink); height: 14px; }
  .name { width: 70px; font-size: 16px; line-height: 1; }
  .val { font-size: 14px; opacity: 0.55; line-height: 1; }
</style>
</head>
<body>
  <div class="row"><div class="name">space-1</div><div class="bar" style="width:2px;"></div><div class="val">2px</div></div>
  <div class="row"><div class="name">space-2</div><div class="bar" style="width:4px;"></div><div class="val">4px</div></div>
  <div class="row"><div class="name">space-3</div><div class="bar" style="width:8px;"></div><div class="val">8px</div></div>
  <div class="row"><div class="name">space-4</div><div class="bar" style="width:12px;"></div><div class="val">12px</div></div>
  <div class="row"><div class="name">space-5</div><div class="bar" style="width:16px;"></div><div class="val">16px</div></div>
  <div class="row"><div class="name">space-6</div><div class="bar" style="width:24px;"></div><div class="val">24px</div></div>
  <div class="row"><div class="name">space-7</div><div class="bar" style="width:32px;"></div><div class="val">32px</div></div>
</body>
</html>
