<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reference pages</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: #f6f4ef; }
  body { padding: 16px 20px; font-family: var(--font-mono); color: var(--ink); }
  .row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .frame {
    background: var(--paper);
    border: 1px solid var(--ink);
    aspect-ratio: 296 / 128;
    overflow: hidden;
    image-rendering: pixelated;
  }
  .frame img {
    width: 100%; height: 100%; object-fit: cover;
    image-rendering: pixelated;
    display: block;
  }
  .label {
    font-size: 13px; margin-top: 4px; opacity: 0.65; line-height: 1;
  }
</style>
</head>
<body>
  <div class="row">
    <div>
      <div class="frame"><img src="../assets/screens/homepage.png"></div>
      <div class="label">homepage</div>
    </div>
    <div>
      <div class="frame"><img src="../assets/screens/menu.png"></div>
      <div class="label">menu</div>
    </div>
    <div>
      <div class="frame"><img src="../assets/screens/friends_list.png"></div>
      <div class="label">friends list</div>
    </div>
    <div>
      <div class="frame"><img src="../assets/screens/friend_profile.png"></div>
      <div class="label">friend profile</div>
    </div>
    <div>
      <div class="frame"><img src="../assets/screens/user_profile.png"></div>
      <div class="label">my profile</div>
    </div>
    <div>
      <div class="frame"><img src="../assets/screens/pairing.png"></div>
      <div class="label">pairing</div>
    </div>
  </div>
</body>
</html>
